name: Bug report
description: Something in Startica doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't include API keys, tokens or other secrets. For security problems, see SECURITY.md instead of opening an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Inbox
        2. Click "Scan now"
        3. …
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. macOS 15.4, Windows 11 24H2, Ubuntu 24.04
  - type: input
    id: version
    attributes:
      label: Startica version or commit
      description: The commit you built from (`git rev-parse --short HEAD`), or the version from `apps/desktop/package.json`.
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How are you running it?
      options:
        - yarn dev:desktop
        - yarn dev:desktop-web (browser)
        - A build from yarn build:desktop
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Terminal output, the failed job's error from the System page, or browser console errors. Remove anything private.
      render: shell
