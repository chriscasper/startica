name: Release

# Builds the desktop app for macOS (Apple Silicon and Intel), Windows and Linux.
# - Push a tag like v0.2.0 (matching apps/desktop/package.json "version"): builds, signs when
#   the secrets below are set, and uploads everything to a DRAFT GitHub release, which you
#   review and publish by hand. Published releases are what the app's auto-update reads.
#   A last job writes the release notes: a download table linking every installer, then the
#   version's CHANGELOG.md entry (apps/desktop/scripts/release-notes.mjs). 0.x releases are titled "beta".
# - Run it by hand (Actions → Release → Run workflow): builds without publishing and keeps
#   the installers as workflow artifacts, for testing (Windows and Linux included).
#
# Optional secrets (unsigned builds work without them, but macOS auto-update and a smooth
# first launch need signing and notarization):
#   macOS signing:      CSC_LINK (base64 .p12 of a "Developer ID Application" certificate), CSC_KEY_PASSWORD
#   macOS notarizing:   APPLE_API_KEY (contents of the .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER
#   Windows signing:    WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One draft for all three builds. Without it, the build jobs each create their own draft
  # when they upload at the same time, and the files end up split across three releases.
  draft:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft unless it exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "The draft exists."; exit 0; fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes "Building…"

  build:
    name: Build (${{ matrix.os }})
    needs: draft
    # A manual run skips the draft job; build anyway.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    # Notarizing waits for Apple, which can take an hour for a new team's first submissions.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} doesn't match apps/desktop/package.json version $version"; exit 1; fi

      # electron-builder 26 can't set up its own signing keychain: it unlocks the keychain it just
      # created with the .p12 password and fails ("SecKeychainUnlock: ... not correct"). So the
      # certificate goes into a keychain made here, and electron-builder finds the identity in it.
      - name: macOS signing keychain
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then echo "No certificate: the build won't be signed."; exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application" || { echo "::error::The certificate in CSC_LINK isn't a Developer ID Application certificate."; exit 1; }
          echo "MAC_KEYCHAIN_READY=1" >> "$GITHUB_ENV"

      # Set the repository variable MAC_NOTARIZE to "false" to ship signed but un-notarized Mac
      # builds (for example while Apple holds a new team's first submissions). They still update
      # themselves; Gatekeeper asks once on first open.
      - name: macOS notarizing key
        if: runner.os == 'macOS' && vars.MAC_NOTARIZE != 'false'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          # A step's own env isn't visible to its `if`, so the checks are here. Notarizing needs a signed build.
          if [ -z "$APPLE_API_KEY" ]; then echo "No notarizing key: the build won't be notarized."; exit 0; fi
          if [ -z "$CSC_LINK" ]; then echo "::warning::APPLE_API_KEY is set but CSC_LINK isn't: an unsigned build can't be notarized."; exit 0; fi
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY" > ~/private_keys/AuthKey.p8
          echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
          echo "NOTARIZE=-c.mac.notarize=true" >> "$GITHUB_ENV"

      - name: Build and package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows signs from the .pfx; macOS from the keychain made above.
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Without a certificate, build unsigned instead of searching the keychain. A missing secret
          # arrives as an empty string, which electron-builder would read as a certificate path.
          # On macOS the certificate is already in the signing keychain, so discovery stays on.
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            if [ "$MAC_KEYCHAIN_READY" != 1 ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          fi
          publish=never
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then publish=always; fi
          yarn workspace @startica/desktop build ${{ matrix.args }} --publish "$publish" ${NOTARIZE:-}

      - name: Keep the installers
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: startica-${{ runner.os }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          if-no-files-found: error

  notes:
    name: Release notes
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Write the download links and changelog into the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_SIGNED: ${{ secrets.CSC_LINK != '' }}
          MAC_NOTARIZED: ${{ secrets.CSC_LINK != '' && secrets.APPLE_API_KEY != '' && vars.MAC_NOTARIZE != 'false' }}
          WIN_SIGNED: ${{ secrets.WIN_CSC_LINK != '' }}
        run: |
          node apps/desktop/scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --title "$(node apps/desktop/scripts/release-notes.mjs "$GITHUB_REF_NAME" --title)"
