<!doctype html>
<!-- The About window (about/window.mjs). A local file; its only bridge is about/preload.cjs. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>About Startica</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f2f2f4;
        --fg: #1d1d1f;
        --muted: #6e6e73;
        --edge: transparent;
        --button: #fff;
        --button-edge: rgb(0 0 0 / 0.14);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e20;
          --fg: #f5f5f7;
          --muted: #a1a1a6;
          --edge: rgb(255 255 255 / 0.1);
          --button: #3a3a3c;
          --button-edge: rgb(255 255 255 / 0.12);
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      main {
        height: 100%;
        box-sizing: border-box;
        padding: 24px 20px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .tile {
        width: 80px;
        height: 80px;
        border-radius: 18px;
        background: linear-gradient(#2a2a2e, #111113);
        box-shadow:
          inset 0 0 0 1px var(--edge),
          0 6px 18px -8px rgb(0 0 0 / 0.45);
      }
      .tile svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      h1 {
        margin: 16px 0 6px;
        font-size: 17px;
        font-weight: 700;
      }
      p {
        margin: 0 0 4px;
        font-size: 12px;
      }
      .copyright {
        margin-top: 6px;
      }
      .update {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      button {
        font: inherit;
        font-size: 12px;
        padding: 4px 14px;
        border-radius: 6px;
        border: 1px solid var(--button-edge);
        background: var(--button);
        color: var(--fg);
        box-shadow: 0 1px 1px rgb(0 0 0 / 0.06);
      }
      button:disabled {
        opacity: 0.55;
      }
      .status {
        min-height: 15px;
        margin: 0;
        font-size: 11px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="tile" aria-hidden="true">
        <svg viewBox="100 100 824 824">
          <path fill="#fff" d="M512 232 C 540 420 604 484 792 512 C 604 540 540 604 512 792 C 484 604 420 540 232 512 C 420 484 484 420 512 232 Z" />
          <path fill="#f59e0b" d="M742 262 C 750 314 768 332 820 340 C 768 348 750 366 742 418 C 734 366 716 348 664 340 C 716 332 734 314 742 262 Z" />
        </svg>
      </div>
      <h1 id="name">Startica</h1>
      <p id="version"></p>
      <p class="copyright" id="copyright"></p>
      <div class="update">
        <button id="check" type="button">Check for Updates…</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>
    </main>
    <script>
      const button = document.getElementById("check");
      const statusLine = document.getElementById("status");

      // Mirrors updater.mjs's states; the restart prompt itself still comes from the updater.
      function show(status) {
        const state = status?.state ?? "idle";
        const labels = {
          checking: ["Checking…", ""],
          downloading: ["Downloading…", `Downloading ${status.version ?? "the update"}…`],
          ready: ["Restart to Update", `Version ${status.version} is ready to install.`],
          current: ["Check for Updates…", "You have the latest version."],
          error: ["Check for Updates…", "Couldn't check for updates. Try again later."],
          dev: ["Check for Updates…", "Updates work in the installed app."],
        };
        const [label, text] = labels[state] ?? ["Check for Updates…", ""];
        button.textContent = label;
        button.disabled = state === "checking" || state === "downloading" || state === "dev";
        statusLine.textContent = text;
        statusLine.title = state === "error" ? (status.error ?? "") : "";
      }

      button.addEventListener("click", () => void window.about.check());
      window.about.onStatus(show);
      window.about.info().then((info) => {
        if (!info) return;
        document.getElementById("name").textContent = info.name;
        document.getElementById("version").textContent = `Version ${info.version}`;
        document.getElementById("copyright").textContent = info.copyright;
        show(info.status);
      });
    </script>
  </body>
</html>
